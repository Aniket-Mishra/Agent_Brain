[project]
name = "agent-brain"
version = "0.1.0"
description = "Read-only Obsidian tools and chat using local Ollama models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pyyaml>=6.0.3",
    "streamlit>=1.64",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# This is an app run with `streamlit run app.py`, not an installed package, so
# the modules are imported from the repository root rather than site-packages.
pythonpath = ["."]
